<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Operators Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .calculator {
            background: #1a1a2e;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 24px;
            width: 320px;
            max-width: 100%;
        }

        .display {
            background: #16213e;
            color: white;
            font-size: 2.5rem;
            padding: 20px;
            text-align: right;
            border-radius: 16px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-weight: 300;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 64px);
            gap: 16px;
        }

        button {
            border: none;
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .number {
            background: #0f3460;
            color: white;
        }

        .number:hover {
            background: #16213e;
        }

        .operator {
            background: #e94560;
            color: white;
        }

        .operator:hover {
            background: #f05470;
        }

        .clear {
            background: #ff6b6b;
            color: white;
        }

        .clear:hover {
            background: #ff8e8e;
        }

        .zero {
            grid-column: span 2;
        }

        .equals {
            background: #4ecdc4;
            color: white;
            grid-row: span 2;
        }

        .equals:hover {
            background: #44d3d0;
        }

        @media (max-width: 400px) {
            .buttons {
                grid-template-rows: repeat(5, 56px);
            }
            
            button {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="clear" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="inputOperator('/')">÷</button>
            <button class="operator" onclick="inputOperator('*')">×</button>
            
            <button class="number" onclick="inputNumber('7')">7</button>
            <button class="number" onclick="inputNumber('8')">8</button>
            <button class="number" onclick="inputNumber('9')">9</button>
            <button class="operator" onclick="inputOperator('-')">-</button>
            
            <button class="number" onclick="inputNumber('4')">4</button>
            <button class="number" onclick="inputNumber('5')">5</button>
            <button class="number" onclick="inputNumber('6')">6</button>
            <button class="operator" onclick="inputOperator('+')">+</button>
            
            <button class="number" onclick="inputNumber('1')">1</button>
            <button class="number" onclick="inputNumber('2')">2</button>
            <button class="number" onclick="inputNumber('3')">3</button>
            <button class="equals" onclick="calculate()">=</button>
            
            <button class="number zero" onclick="inputNumber('0')">0</button>
            <button class="number" onclick="inputDecimal()">.</button>
        </div>
    </div>

    <script>
        let displayValue = '0';
        let firstOperand = null;
        let operator = null;
        let waitingForSecondOperand = false;
        let expression = '';
        
        function updateDisplay() {
            if (waitingForSecondOperand) {
                document.getElementById('display').textContent = expression;
            } else {
                document.getElementById('display').textContent = expression + displayValue;
            }
        }
        
        function inputNumber(num) {
            if (waitingForSecondOperand) {
                displayValue = num;
                waitingForSecondOperand = false;
            } else {
                displayValue = displayValue === '0' ? num : displayValue + num;
            }
            updateDisplay();
        }
        
        function inputDecimal() {
            if (!displayValue.includes('.')) {
                displayValue += '.';
            }
            updateDisplay();
        }
        
        function inputOperator(nextOperator) {
            const inputValue = parseFloat(displayValue);
        
            if (firstOperand === null) {
                firstOperand = inputValue;
            } else if (operator && !waitingForSecondOperand) {
                const result = performCalculation();
                displayValue = result.toString();
                firstOperand = result;
            }
        
            operator = nextOperator;
            expression = firstOperand + ' ' + operator; // FIXED (no extra space & no repeat)
            waitingForSecondOperand = true;
        
            updateDisplay();
        }
        
        function performCalculation() {
            const secondOperand = parseFloat(displayValue);
        
            if (isNaN(firstOperand) || isNaN(secondOperand)) return secondOperand;
        
            let result;
        
            switch (operator) {
                case '+':
                    result = firstOperand + secondOperand;
                    break;
                case '-':
                    result = firstOperand - secondOperand;
                    break;
                case '*':
                    result = firstOperand * secondOperand;
                    break;
                case '/':
                    if (secondOperand === 0) {
                        displayValue = 'Error';
                        expression = '';
                        updateDisplay();
                        setTimeout(clearAll, 1500);
                        return 0;
                    }
                    result = firstOperand / secondOperand;
                    break;
                default:
                    return secondOperand;
            }
        
            return Math.round(result * 100000000) / 100000000;
        }
        
        function calculate() {
            if (operator && !waitingForSecondOperand) {
                const result = performCalculation();
                displayValue = result.toString();
                expression = '';
                firstOperand = null;
                operator = null;
                updateDisplay();
            }
        }
        
        function clearAll() {
            displayValue = '0';
            firstOperand = null;
            operator = null;
            expression = '';
            waitingForSecondOperand = false;
            updateDisplay();
        }
        
        function deleteLast() {
            displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : '0';
            updateDisplay();
        }
        
        /* Keyboard support */
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
            else if (e.key === '.') inputDecimal();
            else if (['+', '-', '*', '/'].includes(e.key)) inputOperator(e.key);
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Escape') clearAll();
            else if (e.key === 'Backspace') deleteLast();
        });
        </script>
</body>
</html>
